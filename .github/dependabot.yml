version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Major bumps need hand review (breaking changes). Patch + minor only.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      types:
        patterns:
          - "@types/*"
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
